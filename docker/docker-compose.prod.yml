services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: gasela_hris
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Isi DB_ROOT_PASSWORD di .env}
    volumes:
      - mysql-data:/var/lib/mysql
      - mysql-backups:/backups
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ..
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    env_file: ../apps/backend/.env
    environment:
      DATABASE_URL: mysql://root:${DB_ROOT_PASSWORD:?Isi DB_ROOT_PASSWORD di .env}@mysql:3306/gasela_hris
      CORS_ORIGINS: ${CORS_ORIGINS:?Isi CORS_ORIGINS di .env}
    ports:
      - '3001:3001'
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - backend-uploads:/app/uploads

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    env_file: ../apps/web/.env
    environment:
      NEXT_PUBLIC_API_URL: http://backend:3001
    ports:
      - '3000:3000'
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - '8080:80'
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-www:/var/www/certbot
      - certbot-conf:/etc/letsencrypt
    depends_on:
      - backend
      - web

  certbot:
    image: certbot/certbot
    volumes:
      - certbot-www:/var/www/certbot
      - certbot-conf:/etc/letsencrypt

volumes:
  mysql-data:
  mysql-backups:
  backend-uploads:
  certbot-www:
  certbot-conf:
