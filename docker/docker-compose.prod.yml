services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      TZ: Asia/Jakarta
      MYSQL_DATABASE: gasela_hris
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Isi DB_ROOT_PASSWORD di .env}
    volumes:
      - mysql-data:/var/lib/mysql
      - mysql-backups:/backups
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ..
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    env_file: ../apps/backend/.env
    environment:
      TZ: Asia/Jakarta
      NODE_ENV: production
      # Connection pool: 20 koneksi DB per container, cukup untuk 1.000 user/hari
      DATABASE_URL: mysql://root:${DB_ROOT_PASSWORD:?Isi DB_ROOT_PASSWORD di .env}@mysql:3306/gasela_hris?connection_limit=20&pool_timeout=30&connect_timeout=10
      CORS_ORIGINS: ${CORS_ORIGINS:?Isi CORS_ORIGINS di .env}
    ports:
      - '3001:3001'
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - backend-uploads:/app/uploads
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:3001/api/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # Resource limits untuk VPS 2 core / 4GB RAM
    # Sesuaikan dengan spesifikasi server Anda
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    env_file: ../apps/web/.env
    environment:
      TZ: Asia/Jakarta
      NEXT_PUBLIC_API_URL: http://backend:3001
      PORT: 3000
      HOSTNAME: '0.0.0.0'
    ports:
      - '3000:3000'
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - '8080:80'
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-www:/var/www/certbot
      - certbot-conf:/etc/letsencrypt
    depends_on:
      - backend
      - web

  certbot:
    image: certbot/certbot
    volumes:
      - certbot-www:/var/www/certbot
      - certbot-conf:/etc/letsencrypt

volumes:
  mysql-data:
  mysql-backups:
  backend-uploads:
  certbot-www:
  certbot-conf:
